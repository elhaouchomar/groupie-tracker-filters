{{define "Header"}}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Data</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/select.css">
    <link rel="stylesheet" href="/static/search.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>
    <header>
        <input type="checkbox" name="" id="chk1">
        <div class="logo">
            <h1>Groupie</h1>
            <h1>Tracker</h1>
        </div>

        <div class="search-box">
            <input type="text" id="srch" placeholder="Search..." onkeyup="debounceSearch()">
            <div id="search-results"></div>
            <button type="submit"><i class="fa fa-search"></i></button>
        </div>

        <ul class="nav">
            <li><a href="/">Home</a></li>
            <li><a href="/artists">Artists</a></li>
            <li><a href="/locations">Locations</a></li>
            <li><a href="/dates">Dates</a></li>
            <li><a href="/relations">Relations</a></li>
            <li><a href="/members">Members</a></li>
        </ul>

        <div class="menu">
            <label for="chk1" class="menu-open">
                <i class="fa fa-bars"></i>
            </label>
        </div>
    </header>
    <script src="/dynamic/search.js" defer></script>
</body>

</html>
{{end}}
