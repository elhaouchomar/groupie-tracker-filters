{{template "Header" .}}
<section id="filter1">
    <div class="choose-artists">
        <h2>Choose Your Artists</h2>
        <form id="myForm" method="post" action="/filter/all">
            <input type="checkbox" id="checkbox1" name="filter-cd">
            <label for="checkbox1">Creation Date</label>
            <div class="date-inputs dates1">
                <label for="start-date1">From:</label>
                <input type="range" id="start-date1" name="start-date1" max="2024" min="1900" value="1900"
                    oninput="this.nextElementSibling.value = this.value">
                <output id="creationstart">1900</output>
                <label for="end-date1">To:</label>
                <input type="range" id="end-date1" name="end-date1" max="2024" min="1900" value="2024"
                    oninput="this.nextElementSibling.value = this.value">
                <output id="creationend">2024</output>
            </div>

            <input type="checkbox" id="checkbox2" name="filter-fad">
            <label for="checkbox2">First Album Date</label>
            <div class="date-inputs dates2">
                <label for="start-date2">From:</label>
                <input type="range" id="start-date2" name="start-date2" max="2024" min="1900" value="1900"
                    oninput="this.nextElementSibling.value = this.value">
                <output id="creationstart">1900</output>

                <label for="end-date2">To:</label>
                <input type="range" id="end-date2" name="end-date2" max="2024" min="1900" value="2024"
                    oninput="this.nextElementSibling.value = this.value">
                <output id="creationstart">2024</output>
            </div>

            <input type="checkbox" id="checkbox3" name="filter-nom">
            <label for="checkbox3">Number of Members</label>
            <div class="date-inputs dates3">
                <div class="checkbox-group">
                        <label>1 <input type="checkbox" name="number" value="1"></label>
                        <label>2 <input type="checkbox" name="number" value="2"></label>
                        <label>3 <input type="checkbox" name="number" value="3"></label>
                        <label>4 <input type="checkbox" name="number" value="4"></label>
                        <label>5 <input type="checkbox" name="number" value="5"></label>
                        <label>6 <input type="checkbox" name="number" value="6"></label>
                        <label>7 <input type="checkbox" name="number" value="7"></label>
                        <label>8 <input type="checkbox" name="number" value="8"></label>
                </div>
            </div>

            <input type="checkbox" id="checkbox4" name="filter-loc">
            <label for="checkbox4">Location</label>
            <div class="date-inputs dates4">
                <label for="location">Location:</label>
                <input type="text" id="location" name="location">
            </div>
            <a href="#filter2" class="btn-action">Find</a>
        </form>
    </div>
</section>

<section id="filter2">
    <div class="container">
        <main>
            {{if .}}
            <div class="artists-grid">
                {{range .}}
                <div class="artist-card">
                    <a href="/details/{{.ID}}">
                        <div class="artist-image-wrapper">
                            <img src="{{.Image}}" alt="{{.Name}}" class="artist-image">
                        </div>
                        <h2 class="head2">{{.Name}}</h2><br>
                        <div class="artist-details">
                            <p>Creation Date: {{.CreationDate}}</p><br>
                            <p>First Album: {{.FirstAlbum}}</p><br>
                            <p>Number of Members: {{len .Members}}</p>
                        </div>
                    </a>
                </div>
                {{end}}
            </div>
            {{else}}
            <p>No artists data available.</p>
            {{end}}
        </main>
    </div>
