{{template "Header" .}}
<section id="filter1">
    <div class="choose-artists">
        <h2>Choose Your Artists</h2>
        <form id="myForm" method="post" action="/filter">
            <input type="checkbox" id="checkbox-creation-date" name="filter-cd">
            <label for="checkbox-creation-date">Creation Date</label>
            <div class="date-inputs">
                <label for="start-date1">From:</label>
                <input type="range" id="start-date1" name="start-date1" max="2024" min="1900" value="1900"
                    oninput="this.nextElementSibling.value = this.value">
                <output id="creationstart">1900</output>
                <label for="end-date1">To:</label>
                <input type="range" id="end-date1" name="end-date1" max="2024" min="1900" value="2024"
                    oninput="this.nextElementSibling.value = this.value">
                <output id="creationend">2024</output>
            </div>
            <input type="checkbox" id="checkbox-first-album-date" name="filter-fad">
            <label for="checkbox-first-album-date">First Album Date</label>
            <div class="date-inputs">
                <label for="start-date2">From:</label>
                <input type="range" id="start-date2" name="start-date2" max="2024" min="1900" value="1900"
                    oninput="this.nextElementSibling.value = this.value">
                <output id="creationstart">1900</output>
                <label for="end-date2">To:</label>
                <input type="range" id="end-date2" name="end-date2" max="2024" min="1900" value="2024"
                    oninput="this.nextElementSibling.value = this.value">
                <output id="creationstart">2024</output>
            </div>
            <input type="checkbox" id="checkbox-number-of-members" name="filter-nom">
            <label for="checkbox-number-of-members">Number of Members</label>
            <div class="checkbox-group">
                <div class="checkbox-item">
                    <input type="checkbox" id="checkbox1" name="number" value="1">
                    <label for="checkbox1">1</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="checkbox2" name="number" value="2">
                    <label for="checkbox2">2</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="checkbox3" name="number" value="3">
                    <label for="checkbox3">3</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="checkbox4" name="number" value="4">
                    <label for="checkbox4">4</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="checkbox5" name="number" value="5">
                    <label for="checkbox5">5</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="checkbox6" name="number" value="6">
                    <label for="checkbox6">6</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="checkbox7" name="number" value="7">
                    <label for="checkbox7">7</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="checkbox8" name="number" value="8">
                    <label for="checkbox8">8</label>
                </div>
            </div>
            <input type="checkbox" id="checkbox-location" name="filter-loc">
            <label for="checkbox-location">Location</label>
            <div class="date-inputs">
                <label for="location"></label>
                <input type="text" id="location" name="location">
            </div>
            <button type="submit" class="btn-action">Find</button>
        </form>
    </div>
</section>
</body>

</html>
